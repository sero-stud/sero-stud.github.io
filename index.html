<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세로 — 에어컨·제빙기 청소, 작업 영상으로 남겨드립니다</title>
<meta name="description" content="서울·경기 에어컨, 제빙기 분해 청소. 작업 과정을 영상으로 남기고 가게 홍보까지 해드립니다.">
<style>
  :root{--navy:#163060;--ink:#1d1d1f;--sub:#5c6470;--line:#e6e8ec;--bg:#fff;--green:#03c75a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}
  header{background:var(--navy);color:#fff;padding:40px 0 32px}
  header h1{font-size:30px;letter-spacing:-0.5px}
  header h1 small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:4px}
  header p{margin:14px 0 20px;font-size:16px;opacity:.92;max-width:560px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-block;padding:12px 18px;border-radius:8px;font-weight:700;text-decoration:none;font-size:15px}
  .btn-green{background:var(--green);color:#fff}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
  section{padding:32px 0;border-bottom:1px solid var(--line)}
  h2{font-size:20px;margin-bottom:6px}
  .lead{color:var(--sub);font-size:14px;margin-bottom:16px}
  #map{width:100%;height:420px;border-radius:12px;border:1px solid var(--line);background:#f3f4f6}
  .count{font-size:13px;color:var(--sub);margin-top:8px}
  .videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .video{aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000}
  .video iframe{width:100%;height:100%;border:0}
  .info{font-size:13px;line-height:1.45;padding:10px 12px;min-width:200px}
  .info b{font-size:14px;display:block;margin-bottom:2px}
  .info a{color:var(--navy);font-weight:700}
  footer{padding:28px 0 40px;font-size:13px;color:var(--sub)}
  footer a{color:var(--sub)}
  @media (max-width:600px){header h1{font-size:26px} #map{height:340px}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>세로 <small>에어컨 · 제빙기 청소</small></h1>
    <p>어디까지 뜯어서 어떻게 닦았는지, 작업 과정을 영상으로 남겨드립니다.<br>원하시면 그 영상으로 가게 홍보까지 해드려요.</p>
    <div class="btns">
      <a class="btn btn-green" href="/go/">네이버 예약하기</a>
      <a class="btn btn-ghost" href="/yt/">작업 영상 보기</a>
    </div>
  </div>
</header>

<section>
  <div class="wrap">
    <h2>세로가 청소한 가게</h2>
    <p class="lead">핀을 누르면 어떤 작업을 했는지, 영상은 어디서 보는지 나옵니다.</p>
    <div id="map"></div>
    <div class="count" id="count">불러오는 중…</div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2>최근 작업 영상</h2>
    <p class="lead">쇼츠로 짧게. 전체는 유튜브 채널에서.</p>
    <div class="videos" id="videos"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    세로 · 서울 중랑구 · <a href="tel:01027900180">010-2790-0180</a><br>
    유튜브 <a href="/yt/">세로로 홍보해드림</a>
  </div>
</footer>

<!-- ====== 여기 두 개만 채우면 됨 ====== -->
<script>
  const NAVER_CLIENT_ID = "shp00ewa7b";
  const SHEET_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRfCQE8qTv5nB82JYMMRQCUKoXvoEZtC9D5OnvYypx8BfrZOMec25Xh9KpMFAUtn4zIu_HCX24E73Gs/pub?output=csv";
</script>
<!-- ================================== -->

<script>
  // 네이버 지도 스크립트 동적 로드 (geocoder 서브모듈 포함)
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_CLIENT_ID}&submodules=geocoder`;
  s.onload = init;
  document.head.appendChild(s);

  function parseCSV(text){
    const rows=[]; let row=[], cur="", q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else if(c==='"') q=true;
      else if(c===','){row.push(cur);cur="";}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(c!=='\r') cur+=c;
    }
    if(cur!==""||row.length){row.push(cur);rows.push(row);}
    const head=rows.shift().map(h=>h.trim());
    return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
  }

  function ytId(url){
    const m = url.match(/(?:shorts\/|v=|youtu\.be\/)([\w-]{11})/); return m?m[1]:null;
  }

  async function init(){
    const map = new naver.maps.Map("map",{center:new naver.maps.LatLng(37.56,127.0),zoom:10});
    const countEl=document.getElementById("count");
    let data=[];
    try{
      const res=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now());
      data=parseCSV(await res.text());
    }catch(e){ countEl.textContent="가게 목록을 불러오지 못했습니다."; return; }

    const info=new naver.maps.InfoWindow({borderWidth:0,backgroundColor:"#fff",anchorSize:new naver.maps.Size(10,10)});
    const bounds=new naver.maps.LatLngBounds();
    let ok=0;

    for(const row of data){
      if(!row["주소"]) continue;
      await new Promise(resolve=>{
        naver.maps.Service.geocode({query:row["주소"]},(status,resp)=>{
          const a=resp&&resp.v2&&resp.v2.addresses&&resp.v2.addresses[0];
          if(status!==naver.maps.Service.Status.OK||!a){resolve();return;}
          const pos=new naver.maps.LatLng(+a.y,+a.x);
          const marker=new naver.maps.Marker({position:pos,map,title:row["가게명"]});
          bounds.extend(pos); ok++;
          const html=`<div class="info"><b>${row["가게명"]||""}</b>
            ${row["작업"]||""}${row["날짜"]?" · "+row["날짜"]:""}<br>
            ${row["영상링크"]?`<a href="${row["영상링크"]}" target="_blank">작업 영상 ▶</a>`:""}
            ${row["플레이스링크"]?` &nbsp; <a href="${row["플레이스링크"]}" target="_blank">가게 보기</a>`:""}</div>`;
          naver.maps.Event.addListener(marker,"click",()=>{info.setContent(html);info.open(map,marker);});
          resolve();
        });
      });
    }
    countEl.textContent = ok ? `지금까지 ${ok}곳` : "아직 등록된 가게가 없습니다.";
    if(ok) map.fitBounds(bounds,{top:40,right:40,bottom:40,left:40});

    // 최근 영상 3개 (시트의 영상링크 중 최신 순)
    const vids=data.filter(r=>ytId(r["영상링크"]||"")).slice(-3).reverse();
    const vEl=document.getElementById("videos");
    vEl.innerHTML = vids.length
      ? vids.map(r=>`<div class="video"><iframe src="https://www.youtube.com/embed/${ytId(r["영상링크"])}" allowfullscreen loading="lazy"></iframe></div>`).join("")
      : `<p class="lead">첫 영상 준비 중입니다.</p>`;
  }
</script>
</body>
</html>
