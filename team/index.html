<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>세로 · 팀 업무</title>
<style>
:root{--navy:#163060;--muted:#68768a;--border:#e1e6ef}*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#18263b;font:15px/1.5 system-ui,-apple-system,'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:white;border-radius:10px;padding:10px 15px;color:var(--navy)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #84b3ff;outline-offset:2px}.primary{background:var(--navy);color:white;border-color:var(--navy)}header{background:var(--navy);color:white;padding:25px max(20px,calc((100vw - 1200px)/2))}header small{letter-spacing:2px;color:#c0d1ec}h1{font-size:25px;margin:5px 0}.wrap{max-width:1240px;padding:24px 20px;margin:auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.toolbar .grow{flex:1}.muted{color:var(--muted)}#status{min-height:24px;font-size:13px;margin-bottom:12px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.column{background:#eaf0f7;border:1px solid #dce4f0;border-radius:16px;padding:17px;align-self:start}.column h2{font-size:18px;margin:0}.column-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.count{font-size:12px;color:var(--muted);margin-top:4px}.task{padding:17px;background:white;border:1px solid var(--border);border-radius:12px;margin-bottom:11px;box-shadow:0 2px 4px #16306004}.task-top{display:flex;gap:10px;align-items:flex-start}.task input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--navy);margin-top:3px}.task strong{overflow-wrap:anywhere}.task p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--muted);margin:10px 0}.task footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}.task footer button{font-size:12px;padding:4px 9px}.done strong{text-decoration:line-through;color:var(--muted)}.late{color:#bd382d!important}.empty{text-align:center;padding:35px 10px;color:var(--muted);font-size:13px}.add{width:100%;background:transparent;border:1px dashed #aebdd0}dialog{border:0;border-radius:18px;width:min(460px,calc(100vw - 32px));padding:25px;box-shadow:0 20px 80px #14284833}dialog::backdrop{background:#12244066}dialog h2{margin:0 0 18px;font-size:21px}label.field{display:block;margin:13px 0}label.field span{display:block;font-size:13px;margin-bottom:6px}input:not([type=checkbox]),select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e2;border-radius:9px;background:white;color:#18263b}textarea{resize:vertical;min-height:100px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.login{max-width:420px;background:white;border:1px solid var(--border);padding:28px;border-radius:18px;margin:45px auto}.login h2{margin-top:0}.error{color:#b12c23;font-size:13px;white-space:pre-wrap}[hidden]{display:none!important}@media(max-width:760px){.board{grid-template-columns:1fr}.wrap{padding:18px 14px}header{padding:20px}.toolbar{gap:8px}.column{padding:15px}}
</style></head><body>
<header><small>SERO TEAM</small><h1>함께 챙기는 오늘의 할 일</h1><div>세로 팀 업무 관리</div></header>
<main class="wrap">
<section id="loginPanel" class="login"><h2>팀 로그인</h2><p class="muted">본인 담당자와 비밀번호로 들어오세요.</p><form id="loginForm"><label class="field"><span>담당자</span><select id="loginUser">
<option value="a">민세한</option>
<option value="b">민경욱</option>
<option value="c">김진솔</option>
</select></label><label class="field"><span>비밀번호</span><input id="pin" type="password" required autocomplete="current-password"></label><p id="loginError" class="error" role="alert"></p><button class="primary" id="loginButton">들어가기</button></form></section>
<section id="app" hidden><div class="toolbar"><strong id="who"></strong><span class="grow"></span><label><input type="checkbox" id="showDone"> 완료한 일 보기</label><button id="refresh">새로고침</button><button id="exit">로그아웃</button></div><div id="status" role="status" aria-live="polite"></div><div class="board" id="board"></div></section>
</main>
<dialog id="editor"><form id="taskForm"><h2 id="editorTitle">할 일 추가</h2><label class="field"><span>담당자</span><select id="assignee"></select></label><label class="field"><span>할 일</span><input id="title" required maxlength="160" placeholder="예: ○○카페 견적 보내기"></label><label class="field"><span>마감일 · 선택</span><input id="due" type="date"></label><label class="field"><span>메모 · 선택</span><textarea id="note" maxlength="3000" placeholder="함께 알아야 할 내용을 적어 주세요."></textarea></label><p id="formError" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel">취소</button><button class="primary" id="save">저장</button></div></form></dialog>
<script>
// 배포 → 웹 앱에서 복사한 /exec 주소를 작은따옴표 안에 넣으세요.
const APP_URL = 'https://script.google.com/macros/s/AKfycbwIhs6s4HrX8fuwnYUd1mXwTd9DeToelOwcnz3eI7xT6H-UGX6D64O6WFO516tYjD8/exec';
let token='',team=[],tasks=[],editing=null,busy=false,timer=null,loading=false,generation=0;
function validEndpoint(){try{const u=new URL(APP_URL);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname)&&!u.search&&!u.hash;}catch{return false;}}
const $=id=>document.getElementById(id);
async function call(name,...args){
 if(!validEndpoint())throw new Error('관리자가 team/index.html의 APP_URL에 웹 앱 배포 주소를 먼저 넣어 주세요.');
 const payload={action:name};
 if(name==='login'){payload.id=args[0];payload.pin=args[1];}
 else{payload.token=args[0];if(['saveTask','getComments','addComment'].includes(name))payload.task=args[1];}
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);
 try{
   const res=await fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),credentials:'omit',redirect:'follow',cache:'no-store',signal:controller.signal});
   if(!res.ok)throw new Error('서버 응답 오류입니다. 웹 앱 배포 설정을 확인하세요.');
   let result;try{result=JSON.parse(await res.text());}catch{throw new Error('서버 연결을 확인하세요. 배포는 실행 사용자 ‘나’, 액세스 ‘모든 사용자’로 설정해야 합니다.');}
   if(!result.ok){const err=new Error(result.error||'요청을 처리하지 못했습니다.');err.code=result.code;throw err;}
   return result.data;
 }catch(err){
   if(err.name==='AbortError'||err instanceof TypeError)throw new Error(['saveTask','addComment'].includes(name)?'저장 결과를 확인하지 못했습니다. 취소 후 새로고침으로 반영 여부를 확인하고 다시 시도하세요.':'서버에 연결하지 못했습니다. 인터넷과 웹 앱 배포 주소·권한을 확인하세요.');
   throw err;
 }finally{clearTimeout(timeout);}
}
function message(e){return e&&e.message?e.message:String(e);}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function setBusy(v){busy=v;$('save').disabled=v;$('refresh').disabled=v;document.querySelectorAll('#board button,#board input').forEach(e=>e.disabled=v);}
async function load(quiet=false){
 if(!token||busy||loading)return;
 loading=true;const epoch=generation;
 if(!quiet)$('status').textContent='공유 할 일을 불러오는 중…';
 try{const data=await call('getBoard',token);if(epoch!==generation)return;team=data.team;tasks=data.tasks;if(!$('editor').open&&!busy)render();$('status').textContent='최근 확인 '+new Date().toLocaleTimeString('ko-KR')+' · 30초마다 확인';}
 catch(e){$('status').textContent=message(e);if(e.code==='AUTH_EXPIRED'){leave();$('loginError').textContent='로그인이 만료되었습니다. 다시 로그인하세요.';}}finally{loading=false;}
}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function render(){
 $('board').replaceChildren();
 team.forEach(person=>{
  const all=tasks.filter(t=>t.assignee===person.id),visible=all.filter(t=>$('showDone').checked||!t.done).sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')||b.createdAt.localeCompare(a.createdAt));
  const col=node('section',undefined,'column'),head=node('div',undefined,'column-head'),info=node('div');
  info.append(node('h2',person.name),node('div',`남은 일 ${all.filter(t=>!t.done).length} · 완료 ${all.filter(t=>t.done).length}`,'count'));head.append(info);col.append(head);
  visible.forEach(task=>{
   const card=node('article',undefined,'task'+(task.done?' done':'')),top=node('div',undefined,'task-top'),check=document.createElement('input');check.type='checkbox';check.checked=task.done;check.setAttribute('aria-label',task.title+' 완료');check.onchange=()=>toggle(task,check.checked);top.append(check,node('strong',task.title));card.append(top);
   if(task.note)card.append(node('p',task.note));
   const foot=node('footer'),due=node('span',task.due?'마감 '+task.due:'마감일 없음',!task.done&&task.due&&task.due<today()?'late':'');const edit=node('button','수정');edit.onclick=()=>openEditor(person.id,task);foot.append(due,edit);card.append(foot);appendTaskExtras(card,task);col.append(card);
  });
  if(!visible.length)col.append(node('div','등록된 할 일이 없어요.','empty'));
  const add=node('button','+ 할 일 추가','add');add.onclick=()=>openEditor(person.id);col.append(add);$('board').append(col);
 });
}
function openEditor(id,task=null){editing=task;$('editorTitle').textContent=task?'할 일 수정':'할 일 추가';$('assignee').replaceChildren(...team.map(x=>{const o=node('option',x.name);o.value=x.id;return o;}));$('assignee').value=id;$('title').value=task?.title||'';$('due').value=task?.due||'';$('note').value=task?.note||'';$('formError').textContent='';$('editor').showModal();$('title').focus();}
async function toggle(task,done){setBusy(true);try{await call('saveTask',token,{...task,done});}catch(e){$('status').textContent=message(e);render();setBusy(false);return;}setBusy(false);await load();}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;$('loginError').textContent='';try{const r=await call('login',$('loginUser').value,$('pin').value);token=r.token;$('pin').value='';$('who').textContent=r.user.name+'님';$('loginPanel').hidden=true;$('app').hidden=false;await load();timer=setInterval(()=>{if(!document.hidden&&!$('editor').open)load(true);},30000);}catch(e){$('loginError').textContent=message(e);}finally{$('loginButton').disabled=false;}};
$('taskForm').onsubmit=async e=>{e.preventDefault();setBusy(true);$('formError').textContent='';try{await call('saveTask',token,{id:editing?.id,revision:editing?.revision,assignee:$('assignee').value,title:$('title').value,note:$('note').value,due:$('due').value,done:editing?.done||false});$('editor').close();}catch(e){$('formError').textContent=message(e);}finally{setBusy(false);}if(!$('editor').open)await load();};
$('cancel').onclick=()=>{if(!busy)$('editor').close();};$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault();});$('showDone').onchange=render;$('refresh').onclick=()=>load();
function leave(){generation++;clearInterval(timer);token='';tasks=[];team=[];$('board').replaceChildren();$('app').hidden=true;$('loginPanel').hidden=false;}
$('exit').onclick=()=>{call('logout',token).catch(()=>{});leave();};
if(!validEndpoint()){$('loginButton').disabled=true;$('loginError').textContent='연결 전입니다. team/index.html의 APP_URL에 /exec로 끝나는 웹 앱 배포 주소를 넣어 주세요.';}
// 등록자 표시와 댓글 화면
let commentTaskId = '', commentBusy = false, pendingComment = null;
const commentDialog = document.createElement('dialog');
commentDialog.id = 'commentDialog';
commentDialog.innerHTML = `
  <h2 id="commentTitle">댓글</h2>
  <p class="muted">진행 상황을 남겨 주세요. 업무 메모는 그대로 유지됩니다.</p>
  <div id="commentList" style="max-height:35vh;overflow:auto" aria-live="polite"></div>
  <form id="commentForm">
    <label class="field"><span>댓글 내용</span>
      <textarea id="commentText" required maxlength="2000" placeholder="예: 남색 재고 확인했습니다."></textarea>
    </label>
    <p id="commentError" class="error" role="alert"></p>
    <div class="actions">
      <button id="commentRefresh" type="button">새로고침</button>
      <button id="commentClose" type="button">닫기</button>
      <button id="commentSave" class="primary" type="submit">댓글 등록</button>
    </div>
  </form>`;
document.body.append(commentDialog);

function teamNameV3(id) {
  return team.find(u=>u.id===id)?.name || '확인 불가';
}

function appendTaskExtras(card, task) {
  const author = node('p', task.createdBy
    ? '등록: '+teamNameV3(task.createdBy)
    : '등록: 기록 없음');
  card.append(author);
  const comments = node('button','댓글 보기 / 남기기');
  comments.style.cssText='width:100%;margin-top:2px;font-size:13px';
  comments.type='button';
  comments.onclick=()=>openCommentsV3(task);
  card.append(comments);
}

function commentBusyV3(value) {
  commentBusy=value;
  ['commentSave','commentClose','commentRefresh','commentText'].forEach(id=>$(id).disabled=value);
}

async function refreshCommentsV3() {
  $('commentError').textContent='';
  const epoch=generation, requestedTask=commentTaskId;
  const data=await call('getComments',token,{taskId:requestedTask});
  if(epoch!==generation||requestedTask!==commentTaskId||!commentDialog.open)return;
  const list=$('commentList'); list.replaceChildren();
  if (!data.comments.length) list.append(node('p','아직 댓글이 없어요.','muted'));
  data.comments.forEach(c=>{
    const item=node('article');
    item.style.cssText='padding:12px 0;border-bottom:1px solid #e1e6ef';
    item.append(node('strong',teamNameV3(c.author)));
    const date=new Date(c.createdAt);
    item.append(node('div',isNaN(date.getTime())?'':date.toLocaleString('ko-KR'),'muted'));
    const body=node('p',c.text);body.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';
    item.append(body);list.append(item);
  });
}

async function openCommentsV3(task) {
  commentTaskId=task.id;pendingComment=null;
  $('commentTitle').textContent=task.title+' · 댓글';
  $('commentText').value='';$('commentList').replaceChildren(node('p','불러오는 중…'));
  commentDialog.showModal();commentBusyV3(true);
  try {await refreshCommentsV3();}
  catch(e){$('commentError').textContent=message(e);}
  finally {commentBusyV3(false);}
}

$('commentClose').onclick=()=>{if(!commentBusy)commentDialog.close();};
commentDialog.addEventListener('cancel',e=>{if(commentBusy)e.preventDefault();});
$('commentRefresh').onclick=async()=>{
  commentBusyV3(true);
  try {await refreshCommentsV3();}
  catch(e){$('commentError').textContent=message(e);}
  finally {commentBusyV3(false);}
};
$('commentForm').onsubmit=async e=>{
  e.preventDefault();
  const text=$('commentText').value.trim();if(!text)return;
  if(!pendingComment || pendingComment.text!==text){
    pendingComment={taskId:commentTaskId,text,requestId:crypto.randomUUID()};
  }
  commentBusyV3(true);$('commentError').textContent='';
  try {
    await call('addComment',token,pendingComment);
    $('commentText').value='';pendingComment=null;
    await refreshCommentsV3();
  }catch(e){$('commentError').textContent=message(e)+' 새로고침으로 등록 여부를 확인할 수 있습니다.';}
  finally {commentBusyV3(false);}
};

const leaveBeforeCommentsV3 = leave;
leave = function() {
  commentDialog.close();
  $('commentList').replaceChildren();
  $('commentText').value='';
  $('commentError').textContent='';
  commentTaskId=''; pendingComment=null;
  $('editor').close();
  leaveBeforeCommentsV3();
};

</script></body></html>
