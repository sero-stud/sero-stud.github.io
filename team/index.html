<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>세로 · 팀 업무</title>
<style>
:root{--navy:#163060;--muted:#68768a;--border:#e1e6ef}*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#18263b;font:15px/1.5 system-ui,-apple-system,'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:white;border-radius:10px;padding:10px 15px;color:var(--navy)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #84b3ff;outline-offset:2px}.primary{background:var(--navy);color:white;border-color:var(--navy)}header{background:var(--navy);color:white;padding:25px max(20px,calc((100vw - 1200px)/2))}header small{letter-spacing:2px;color:#c0d1ec}h1{font-size:25px;margin:5px 0}.wrap{max-width:1240px;padding:24px 20px;margin:auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.toolbar .grow{flex:1}.muted{color:var(--muted)}#status{min-height:24px;font-size:13px;margin-bottom:12px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.column{background:#eaf0f7;border:1px solid #dce4f0;border-radius:16px;padding:17px;align-self:start}.column h2{font-size:18px;margin:0}.column-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.count{font-size:12px;color:var(--muted);margin-top:4px}.task{padding:17px;background:white;border:1px solid var(--border);border-radius:12px;margin-bottom:11px;box-shadow:0 2px 4px #16306004}.task-top{display:flex;gap:10px;align-items:flex-start}.task input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--navy);margin-top:3px}.task strong{overflow-wrap:anywhere}.task p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--muted);margin:10px 0}.task footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}.task footer button{font-size:12px;padding:4px 9px}.done strong{text-decoration:line-through;color:var(--muted)}.late{color:#bd382d!important}.empty{text-align:center;padding:35px 10px;color:var(--muted);font-size:13px}.add{width:100%;background:transparent;border:1px dashed #aebdd0}dialog{border:0;border-radius:18px;width:min(460px,calc(100vw - 32px));padding:25px;box-shadow:0 20px 80px #14284833}dialog::backdrop{background:#12244066}dialog h2{margin:0 0 18px;font-size:21px}label.field{display:block;margin:13px 0}label.field span{display:block;font-size:13px;margin-bottom:6px}input:not([type=checkbox]),select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e2;border-radius:9px;background:white;color:#18263b}textarea{resize:vertical;min-height:100px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.login{max-width:420px;background:white;border:1px solid var(--border);padding:28px;border-radius:18px;margin:45px auto}.login h2{margin-top:0}.error{color:#b12c23;font-size:13px;white-space:pre-wrap}[hidden]{display:none!important}@media(max-width:760px){.board{grid-template-columns:1fr}.wrap{padding:18px 14px}header{padding:20px}.toolbar{gap:8px}.column{padding:15px}}

.task-author{font-size:12px;color:var(--muted);margin:8px 0 10px 30px}
.task .inline-comments{border-top:1px solid var(--border);margin-top:15px;padding-top:12px}
.comment-heading,.comment-meta,.comment-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
.comment-heading{font-size:13px;margin-bottom:8px}
.comment-heading button,.comment-more{padding:4px 8px;font-size:12px}
.inline-comment{padding:9px 0;border-bottom:1px solid #eef1f6}
.comment-meta{font-size:12px;flex-wrap:wrap}
.comment-meta time{color:var(--muted);font-size:11px}
.task .comment-body{color:#24364f;margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.task .comment-empty{font-size:12px;margin:8px 0 12px;color:var(--muted)}
.comment-compose{margin-top:12px}
.comment-compose textarea{min-height:62px;font-size:13px}
.comment-actions{justify-content:flex-end;margin-top:6px}
.comment-actions button{padding:7px 11px;font-size:12px}
.inline-comments .error{margin-top:8px}
.done .comment-meta b{text-decoration:none}
.comment-delete-actions{display:flex;justify-content:flex-end;margin-top:4px}.comment-delete{font-size:11px;padding:3px 7px;color:#a4473e;background:transparent}
.task input[type=checkbox]:disabled{cursor:not-allowed;opacity:.5}
</style></head><body>
<header><small>SERO TEAM</small><h1>함께 챙기는 오늘의 할 일</h1><div>세로 팀 업무 관리</div></header>
<main class="wrap">
<section id="loginPanel" class="login"><h2>팀 로그인</h2><p class="muted">본인 담당자와 비밀번호로 들어오세요.</p><form id="loginForm"><label class="field"><span>담당자</span><select id="loginUser">
<option value="a">민세한</option>
<option value="b">민경욱</option>
<option value="c">김진솔</option>
</select></label><label class="field"><span>비밀번호</span><input id="pin" type="password" required autocomplete="current-password"></label><p id="loginError" class="error" role="alert"></p><button class="primary" id="loginButton">들어가기</button></form></section>
<section id="app" hidden><div class="toolbar"><strong id="who"></strong><span class="grow"></span><label><input type="checkbox" id="showDone"> 완료한 일 보기</label><button id="refresh">새로고침</button><button id="exit">로그아웃</button></div><div id="status" role="status" aria-live="polite"></div><div class="board" id="board"></div></section>
</main>
<dialog id="editor"><form id="taskForm"><h2 id="editorTitle">할 일 추가</h2><label class="field"><span>담당자</span><select id="assignee"></select></label><label class="field"><span>할 일</span><input id="title" required maxlength="160" placeholder="예: ○○카페 견적 보내기"></label><label class="field"><span>마감일 · 선택</span><input id="due" type="date"></label><label class="field"><span>메모 · 선택</span><textarea id="note" maxlength="3000" placeholder="함께 알아야 할 내용을 적어 주세요."></textarea></label><p id="formError" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel">취소</button><button class="primary" id="save">저장</button></div></form></dialog>
<script>
// 배포 → 웹 앱에서 복사한 /exec 주소를 작은따옴표 안에 넣으세요.
const APP_URL = 'https://script.google.com/macros/s/AKfycbwIhs6s4HrX8fuwnYUd1mXwTd9DeToelOwcnz3eI7xT6H-UGX6D64O6WFO516tYjD8/exec';
let currentUserId='',token='',team=[],tasks=[],editing=null,busy=false,timer=null,loading=false,generation=0;
function validEndpoint(){try{const u=new URL(APP_URL);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname)&&!u.search&&!u.hash;}catch{return false;}}
const $=id=>document.getElementById(id);
async function call(name,...args){
 if(!validEndpoint())throw new Error('관리자가 team/index.html의 APP_URL에 웹 앱 배포 주소를 먼저 넣어 주세요.');
 const payload={action:name};
 if(name==='login'){payload.id=args[0];payload.pin=args[1];}
 else{payload.token=args[0];if(['saveTask','getComments','addComment','deleteComment'].includes(name))payload.task=args[1];}
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);
 try{
   const res=await fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),credentials:'omit',redirect:'follow',cache:'no-store',signal:controller.signal});
   if(!res.ok)throw new Error('서버 응답 오류입니다. 웹 앱 배포 설정을 확인하세요.');
   let result;try{result=JSON.parse(await res.text());}catch{throw new Error('서버 연결을 확인하세요. 배포는 실행 사용자 ‘나’, 액세스 ‘모든 사용자’로 설정해야 합니다.');}
   if(!result.ok){const err=new Error(result.error||'요청을 처리하지 못했습니다.');err.code=result.code;throw err;}
   return result.data;
 }catch(err){
   if(err.name==='AbortError'||err instanceof TypeError)throw new Error(['saveTask','addComment','deleteComment'].includes(name)?'저장 결과를 확인하지 못했습니다. 취소 후 새로고침으로 반영 여부를 확인하고 다시 시도하세요.':'서버에 연결하지 못했습니다. 인터넷과 웹 앱 배포 주소·권한을 확인하세요.');
   throw err;
 }finally{clearTimeout(timeout);}
}
function message(e){return e&&e.message?e.message:String(e);}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function setBusy(v){busy=v;$('save').disabled=v;$('refresh').disabled=v;document.querySelectorAll('#board button,#board input').forEach(e=>e.disabled=v||(e.type==='checkbox'&&e.dataset.assignee!==currentUserId));}
async function load(quiet=false){
 if(!token||busy||loading)return;
 loading=true;const epoch=generation;
 if(!quiet)$('status').textContent='공유 할 일을 불러오는 중…';
 try{const data=await call('getBoard',token);if(epoch!==generation)return;team=data.team;tasks=data.tasks;if(!$('editor').open&&!busy)render();$('status').textContent='최근 확인 '+new Date().toLocaleTimeString('ko-KR')+' · 30초마다 확인';}
 catch(e){$('status').textContent=message(e);if(e.code==='AUTH_EXPIRED'){leave();$('loginError').textContent='로그인이 만료되었습니다. 다시 로그인하세요.';}}finally{loading=false;}
}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function render(){
 if(commentPosting.size||document.activeElement?.closest?.('.comment-compose'))return;
 commentStates.forEach(s=>{s.view=null;});
 $('board').replaceChildren();
 team.forEach(person=>{
  const all=tasks.filter(t=>t.assignee===person.id),visible=all.filter(t=>$('showDone').checked||!t.done).sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')||b.createdAt.localeCompare(a.createdAt));
  const col=node('section',undefined,'column'),head=node('div',undefined,'column-head'),info=node('div');
  info.append(node('h2',person.name),node('div',`남은 일 ${all.filter(t=>!t.done).length} · 완료 ${all.filter(t=>t.done).length}`,'count'));head.append(info);col.append(head);
  visible.forEach(task=>{
   const card=node('article',undefined,'task'+(task.done?' done':'')),top=node('div',undefined,'task-top'),check=document.createElement('input');check.type='checkbox';check.checked=task.done;check.dataset.assignee=task.assignee;check.disabled=busy||task.assignee!==currentUserId;check.title=task.assignee===currentUserId?'완료 체크 / 해제':'담당자 본인만 완료 체크 / 해제할 수 있어요';check.setAttribute('aria-label',task.title+' 완료');check.onchange=()=>toggle(task,check.checked);top.append(check,node('strong',task.title));card.append(top);
   card.append(node('div',task.createdBy?'등록: '+teamNameV3(task.createdBy):'등록: 기록 없음','task-author'));
   if(task.note)card.append(node('p',task.note));
   const foot=node('footer'),due=node('span',task.due?'마감 '+task.due:'마감일 없음',!task.done&&task.due&&task.due<today()?'late':'');const edit=node('button','수정');edit.onclick=()=>openEditor(person.id,task);foot.append(due,edit);card.append(foot);appendTaskExtras(card,task);col.append(card);
  });
  if(!visible.length)col.append(node('div','등록된 할 일이 없어요.','empty'));
  const add=node('button','+ 할 일 추가','add');add.onclick=()=>openEditor(person.id);col.append(add);$('board').append(col);
 });
 void refreshVisibleComments();
}
function openEditor(id,task=null){editing=task;$('editorTitle').textContent=task?'할 일 수정':'할 일 추가';$('assignee').replaceChildren(...team.map(x=>{const o=node('option',x.name);o.value=x.id;return o;}));$('assignee').value=id;$('title').value=task?.title||'';$('due').value=task?.due||'';$('note').value=task?.note||'';$('formError').textContent='';$('editor').showModal();$('title').focus();}
async function toggle(task,done){if(task.assignee!==currentUserId){$('status').textContent='완료 체크와 해제는 담당자 본인만 할 수 있어요.';render();return;}setBusy(true);try{await call('saveTask',token,{...task,done});}catch(e){$('status').textContent=message(e);render();setBusy(false);return;}setBusy(false);await load();}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;$('loginError').textContent='';try{const r=await call('login',$('loginUser').value,$('pin').value);token=r.token;currentUserId=r.user.id;$('pin').value='';$('who').textContent=r.user.name+'님';$('loginPanel').hidden=true;$('app').hidden=false;await load();timer=setInterval(()=>{if(!document.hidden&&!$('editor').open)load(true);},30000);}catch(e){$('loginError').textContent=message(e);}finally{$('loginButton').disabled=false;}};
$('taskForm').onsubmit=async e=>{e.preventDefault();setBusy(true);$('formError').textContent='';try{await call('saveTask',token,{id:editing?.id,revision:editing?.revision,assignee:$('assignee').value,title:$('title').value,note:$('note').value,due:$('due').value,done:editing?.done||false});$('editor').close();}catch(e){$('formError').textContent=message(e);}finally{setBusy(false);}if(!$('editor').open)await load();};
$('cancel').onclick=()=>{if(!busy)$('editor').close();};$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault();});$('showDone').onchange=render;$('refresh').onclick=()=>load();
function leave(){generation++;clearInterval(timer);token='';currentUserId='';tasks=[];team=[];$('board').replaceChildren();$('app').hidden=true;$('loginPanel').hidden=false;}
$('exit').onclick=()=>{call('logout',token).catch(()=>{});leave();};
if(!validEndpoint()){$('loginButton').disabled=true;$('loginError').textContent='연결 전입니다. team/index.html의 APP_URL에 /exec로 끝나는 웹 앱 배포 주소를 넣어 주세요.';}
// 카드 안에서 바로 읽고 작성하는 댓글
const commentStates = new Map();
const commentPosting = new Set();
function teamNameV3(id){return team.find(u=>u.id===id)?.name||'확인 불가';}
function commentState(id){
  if(!commentStates.has(id))commentStates.set(id,{items:[],loaded:false,loading:false,draft:'',pending:null,deletedIds:new Set(),expanded:false,error:'',view:null});
  return commentStates.get(id);
}
function appendTaskExtras(card,task){
  const state=commentState(task.id),section=node('section',undefined,'inline-comments');
  section.setAttribute('aria-label',task.title+' 댓글');
  const heading=node('div',undefined,'comment-heading'),label=node('b','댓글'),refresh=node('button','새로고침');
  refresh.type='button';refresh.onclick=()=>refreshTaskComments(task.id);heading.append(label,refresh);
  const list=node('div',undefined,'comment-list');list.setAttribute('aria-live','polite');
  const form=node('form',undefined,'comment-compose'),input=node('textarea');
  input.rows=2;input.maxLength=2000;input.required=true;input.value=state.draft;
  input.placeholder='진행 상황이나 답변을 남겨 주세요.';
  input.setAttribute('aria-label',task.title+' 댓글 내용');
  input.oninput=()=>{state.draft=input.value;};
  const actions=node('div',undefined,'comment-actions'),send=node('button','댓글 등록','primary');send.type='submit';
  actions.append(send);form.append(input,actions);
  const error=node('div',undefined,'error');error.setAttribute('role','alert');
  state.view={list,input,send,error,refresh,label};
  form.onsubmit=e=>{e.preventDefault();submitTaskComment(task.id);};
  section.append(heading,list,form,error);card.append(section);
  paintTaskComments(task.id);
}
function paintTaskComments(id){
  const s=commentStates.get(id);if(!s?.view)return;
  const v=s.view;v.list.replaceChildren();v.label.textContent=s.loaded?'댓글 '+s.items.length:'댓글';
  v.error.textContent=s.error;
  v.refresh.disabled=s.loading||commentPosting.has(id);
  v.send.disabled=commentPosting.has(id);v.input.disabled=commentPosting.has(id);
  v.send.textContent=commentPosting.has(id)?'등록 중…':'댓글 등록';
  if(!s.loaded)v.list.append(node('p',s.loading?'댓글 불러오는 중…':'댓글을 불러오지 못했어요.','comment-empty'));
  else if(!s.items.length)v.list.append(node('p','아직 댓글이 없어요.','comment-empty'));
  const items=s.expanded?s.items:s.items.slice(-3);
  if(!s.expanded&&s.items.length>3){
    const more=node('button','이전 댓글 '+(s.items.length-3)+'개 더 보기','comment-more');more.type='button';
    more.onclick=()=>{s.expanded=true;paintTaskComments(id);};v.list.append(more);
  }
  items.forEach(c=>{
    const item=node('article',undefined,'inline-comment'),meta=node('div',undefined,'comment-meta');
    const date=new Date(c.createdAt);meta.append(node('b',teamNameV3(c.author)),node('time',isNaN(date.getTime())?'':date.toLocaleString('ko-KR')));
    item.append(meta,node('p',c.text,'comment-body'));
    if(c.author===currentUserId){
      const actions=node('div',undefined,'comment-delete-actions'),del=node('button','삭제','comment-delete');
      del.type='button';del.disabled=commentPosting.has(id);
      del.setAttribute('aria-label',teamNameV3(c.author)+' 댓글 삭제');
      del.onclick=()=>deleteTaskComment(id,c.id);actions.append(del);item.append(actions);
    }
    v.list.append(item);
  });
  if(s.expanded&&s.items.length>3){
    const less=node('button','최근 댓글만 보기','comment-more');less.type='button';less.onclick=()=>{s.expanded=false;paintTaskComments(id);};v.list.append(less);
  }
}
async function refreshTaskComments(id){
  if(!token)return;
  const s=commentState(id);if(s.loading)return;
  const epoch=generation;s.loading=true;s.error='';paintTaskComments(id);
  try{
    const data=await call('getComments',token,{taskId:id});
    if(epoch!==generation)return;
    s.items=data.comments.filter(c=>!c.deleted&&!s.deletedIds.has(c.id));s.loaded=true;
  }catch(e){
    if(epoch!==generation)return;
    s.error=message(e);
    if(e.code==='AUTH_EXPIRED'){leave();$('loginError').textContent='로그인이 만료되었습니다. 다시 로그인하세요.';}
  }finally{
    if(epoch===generation){s.loading=false;paintTaskComments(id);if(s.refreshAfterLoad){s.refreshAfterLoad=false;void refreshTaskComments(id);}}
  }
}
async function refreshVisibleComments(){
  const ids=Array.from(commentStates).filter(([id,s])=>s.view&&tasks.some(t=>t.id===id&&($('showDone').checked||!t.done))).map(([id])=>id);
  let index=0;const epoch=generation;
  async function worker(){while(index<ids.length&&epoch===generation){await refreshTaskComments(ids[index++]);}}
  await Promise.all([worker(),worker()]);
}
async function submitTaskComment(id){
  const s=commentState(id);if(commentPosting.has(id)||!token)return;
  const text=s.draft.trim();if(!text)return;
  if(!s.pending||s.pending.text!==text)s.pending={taskId:id,text,requestId:crypto.randomUUID()};
  const epoch=generation;commentPosting.add(id);s.error='';paintTaskComments(id);
  try{
    await call('addComment',token,s.pending);
    if(epoch!==generation)return;
    s.draft='';s.pending=null;if(s.view)s.view.input.value='';
    // 조회 중인 응답이 있으면 끝난 뒤 새 댓글을 다시 읽습니다.
    if(s.loading){s.refreshAfterLoad=true;}
    else await refreshTaskComments(id);
  }catch(e){
    if(epoch!==generation)return;
    s.error=message(e)+' 새로고침으로 등록 여부를 확인한 후 다시 시도하세요.';
  }finally{
    if(epoch===generation){commentPosting.delete(id);paintTaskComments(id);}
  }
}

async function deleteTaskComment(taskId,id){
  if(!token||commentPosting.has(taskId))return;
  if(!confirm('이 댓글을 삭제할까요? 화면에서 숨겨지며 시트 기록은 남습니다.'))return;
  const s=commentState(taskId),epoch=generation;
  commentPosting.add(taskId);s.error='';paintTaskComments(taskId);
  try{
    await call('deleteComment',token,{taskId,id});
    if(epoch!==generation)return;
    s.deletedIds.add(id);s.items=s.items.filter(c=>c.id!==id);
    if(s.loading)s.refreshAfterLoad=true;
    else await refreshTaskComments(taskId);
  }catch(e){
    if(epoch!==generation)return;
    s.error=message(e)+' 새로고침으로 삭제 여부를 확인하세요.';
    if(e.code==='AUTH_EXPIRED'){leave();$('loginError').textContent='로그인이 만료되었습니다. 다시 로그인하세요.';}
  }finally{
    if(epoch===generation){commentPosting.delete(taskId);paintTaskComments(taskId);}
  }
}

const leaveWithInlineComments = leave;
leave = function(){
  commentStates.clear();commentPosting.clear();$('editor').close();leaveWithInlineComments();
};
</script></body></html>
