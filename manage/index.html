<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 매장 청소 기록 | 세로</title><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f9;color:#19363b;font:16px/1.6 system-ui,sans-serif}main{max-width:440px;margin:12vh auto;padding:32px 24px;background:white;border-radius:16px}a{color:#015562}h1{font-size:26px}label{display:block;font-weight:bold;margin-top:24px}input,button{width:100%;padding:15px;font:inherit;border-radius:8px;margin-top:8px}input{border:1px solid #bcced1;text-transform:uppercase}button{background:#015562;color:white;border:0;font-weight:bold}small{color:#5c6470}#error{color:#a32323}footer{margin-top:24px}</style><main><a href="/">새것처럼, 세로</a><h1>우리 매장 청소 기록</h1><p>장비에 붙어 있는 스티커의 관리번호를 입력해 주세요.</p><form><label for="id">매장 관리번호</label><input id="id" name="id" placeholder="예: S001" maxlength="12" required autocomplete="off" aria-describedby="error"><button>청소 기록 확인</button><p id="error" role="alert"></p></form><small>번호는 재청소 후에도 그대로 사용합니다.</small><footer><a href="tel:01027900180">번호 확인 문의 010-2790-0180</a></footer></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const id=document.querySelector('input').value.trim().toUpperCase();if(!/^S\d{3,10}$/.test(id)){document.querySelector('#error').textContent='S와 숫자로 된 관리번호를 확인해 주세요. 예: S001';return}location.assign('/?id='+encodeURIComponent(id))}</script></html>
